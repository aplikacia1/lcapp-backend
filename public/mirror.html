<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c1f4b">

  <title>Lištobook – Dnes pribudlo</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0c1f4b;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* =========================
       HLAVNÝ OBAL
    ========================= */

    .mirror-wrap {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 20px 14px 100px;
    }

    /* =========================
       HLAVIČKA
    ========================= */

    .mirror-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .mirror-logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
    }

    .mirror-header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .mirror-subtitle {
      margin-top: 8px;
      color: #cfe2ff;
      font-size: 14px;
      line-height: 1.4;
    }

    /* =========================
       SEKCIE
    ========================= */

    .mirror-section {
      margin-top: 28px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;

      margin: 0 0 12px;

      font-size: 18px;
      font-weight: 700;
    }

    .section-count {
      min-width: 24px;
      height: 24px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 7px;

      border-radius: 999px;

      background: rgba(255,255,255,.14);

      font-size: 12px;
      font-weight: 700;
    }

    /* =========================
       ZIS – DVE KARTY V RIADKU
    ========================= */

    .zis-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .zis-card {
      min-height: 145px;

      background: white;
      color: #0c1f4b;

      border-radius: 15px;
      padding: 12px;

      box-shadow: 0 6px 18px rgba(0,0,0,.18);

      cursor: pointer;

      display: flex;
      flex-direction: column;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .zis-card:active {
      transform: scale(.98);
    }

    .zis-card-image {
      width: 100%;
      height: 76px;

      border-radius: 10px;

      object-fit: contain;

      background: #f4f6fa;

      margin-bottom: 9px;
    }

    .zis-card-title {
      font-size: 14px;
      line-height: 1.25;
      font-weight: 700;

      overflow-wrap: anywhere;
    }

    .zis-card-manufacturer {
      margin-top: 5px;

      color: #667085;

      font-size: 11px;
      line-height: 1.3;
    }

    .zis-open {
      margin-top: auto;
      padding-top: 8px;

      color: #2563eb;

      font-size: 11px;
      font-weight: 700;
    }

    /* =========================
       HODNOTENIA – POD SEBA
    ========================= */

    .ratings-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rating-card {
      width: 100%;

      display: flex;
      gap: 12px;

      background: white;
      color: #0c1f4b;

      border-radius: 15px;
      padding: 12px;

      box-shadow: 0 6px 18px rgba(0,0,0,.18);
    }

    .rating-image {
      width: 68px;
      height: 68px;

      flex: 0 0 68px;

      object-fit: contain;

      border-radius: 10px;

      background: #f4f6fa;
    }

    .rating-content {
      min-width: 0;
      flex: 1;
    }

    .rating-product {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
    }

    .rating-stars {
      margin-top: 4px;

      color: #f5b301;

      font-size: 17px;
      letter-spacing: 1px;
    }

    .rating-author {
      margin-top: 4px;

      color: #667085;

      font-size: 12px;
    }

    .rating-comment {
      margin-top: 7px;

      color: #344054;

      font-size: 13px;
      line-height: 1.35;

      overflow-wrap: anywhere;
    }

    /* =========================
       PRÁZDNY STAV
    ========================= */

    .empty-state {
      display: none;

      background: rgba(255,255,255,.08);

      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;

      padding: 18px;

      text-align: center;

      color: #cfe2ff;

      font-size: 14px;
      line-height: 1.4;
    }

    /* =========================
       NAČÍTAVANIE
    ========================= */

    .loading {
      padding: 30px 10px;

      text-align: center;

      color: #cfe2ff;

      font-size: 14px;
    }

    /* =========================
       SPÄŤ
    ========================= */

    .back-wrap {
      margin-top: 30px;
      text-align: center;
    }

    .back-btn {
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;

      background: white;
      color: #0c1f4b;

      padding: 12px 22px;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    .back-btn:active {
      transform: scale(.98);
    }

  </style>
</head>

<body>

  <main class="mirror-wrap">

    <!-- HLAVIČKA -->

    <header class="mirror-header">

      <img
        src="logo_lc.jpg"
        alt="Lištové centrum"
        class="mirror-logo"
      >

      <h1>🌙 Dnes pribudlo</h1>

      <div class="mirror-subtitle">
        Pozrite si dnešné novinky v Lištobooku.
      </div>

    </header>


    <!-- LOADING -->

    <div id="mirrorLoading" class="loading">
      Načítavam dnešné novinky...
    </div>


    <!-- ZIS KARTY -->

    <section
      id="zisSection"
      class="mirror-section"
      style="display:none;"
    >

      <div class="section-title">

        <span>🔎 Nové produkty</span>

        <span
          id="zisCount"
          class="section-count"
        >
          0
        </span>

      </div>

      <div
        id="zisGrid"
        class="zis-grid"
      ></div>

    </section>


    <!-- HODNOTENIA -->

    <section
      id="ratingsSection"
      class="mirror-section"
      style="display:none;"
    >

      <div class="section-title">

        <span>⭐ Nové hodnotenia</span>

        <span
          id="ratingsCount"
          class="section-count"
        >
          0
        </span>

      </div>

      <div
        id="ratingsList"
        class="ratings-list"
      ></div>

    </section>


    <!-- NIČ NOVÉ -->

    <div
      id="mirrorEmpty"
      class="empty-state"
    >
      Dnes tu zatiaľ nie je nič nové.
    </div>


    <!-- SPÄŤ -->

    <div class="back-wrap">

      <button
        type="button"
        class="back-btn"
        onclick="closeMirror()"
      >
        Späť do Lištobooku
      </button>

    </div>

  </main>


  <script src="mirror.js"></script>

</body>
</html>
